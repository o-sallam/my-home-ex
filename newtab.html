<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #202225;
      color: #dcddde;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
    }

    /* ── History panel ── */
    .history-panel {
      width: 260px;
      flex-shrink: 0;
      background: #18191c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .history-panel .panel-header {
      padding: 20px 16px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #72767d;
      flex-shrink: 0;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 16px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #40444b; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      text-decoration: none;
      color: #b9bbbe;
      border: 2px solid transparent;
      transition: background 0.1s, color 0.1s;
      cursor: pointer;
      overflow: hidden;
    }
    .history-item:hover { background: #2f3136; color: #dcddde; }
    .history-item.selected { background: rgba(88,101,242,0.18); color: #dcddde; border-left: 2px solid #5865f2; }
    .history-item.selected .item-domain { color: #72767d; }

    .history-item img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .history-item .item-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .history-item .item-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item .item-domain {
      font-size: 11px;
      color: #4f545c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      padding: 16px;
      font-size: 13px;
      color: #4f545c;
    }

    .open-selected {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      background: #5865f2;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      width: 100%;
      transition: background 0.12s;
    }
    .open-selected.visible { display: flex; }
    .open-selected:hover { background: #4752c4; }

    @media (max-width: 900px) {
      .history-panel { display: none; }
    }

    /* ── Main content ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Search bar ── */
    .search-wrapper {
      display: flex;
      align-items: center;
      width: 496px;
      background-color: #2f3136;
      border: 2px solid transparent;
      margin-bottom: 12px;
      transition: border-color 0.12s ease;
    }
    .search-wrapper:focus-within { border-color: #5865f2; }
    .search-wrapper i {
      padding: 0 14px;
      color: #72767d;
      font-size: 15px;
      pointer-events: none;
    }
    .search-wrapper input {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: #dcddde;
      font-family: inherit;
      font-size: 15px;
      padding-right: 16px;
    }
    .search-wrapper input::placeholder { color: #72767d; }

    /* ── Label ── */
    .greeting {
      font-size: 14px;
      color: #72767d;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      gap: 8px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 160px;
      height: 160px;
      background-color: #2f3136;
      text-decoration: none;
      color: #dcddde;
      border: 2px solid transparent;
      transition: border-color 0.12s ease;
      cursor: pointer;
    }
    .card:hover { border-color: #5865f2; }
    .card i.card-icon { font-size: 34px; }
    .card span { font-size: 14px; font-weight: 500; letter-spacing: 0.03em; }

    /* edit overlay on each card (visible only in edit mode) */
    .card .edit-hint {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
    }
    body.edit-mode .card:hover .edit-hint { display: flex; }
    body.edit-mode .card { cursor: pointer; }

    /* ── Grid toolbar (edit mode only) ── */
    .grid-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 496px;
      margin-bottom: 8px;
    }
    body.edit-mode .grid-toolbar { display: flex; }

    .toolbar-hint {
      font-size: 11px;
      color: #4f545c;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-btns { display: flex; gap: 4px; }

    .view-btn {
      width: 30px;
      height: 30px;
      background: #2f3136;
      border: 2px solid transparent;
      color: #72767d;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.1s, border-color 0.1s;
    }
    .view-btn:hover { color: #dcddde; border-color: #40444b; }
    .view-btn.active { color: #fff; border-color: #5865f2; }

    /* ── List view overrides ── */
    .grid.list-view {
      grid-template-columns: 1fr;
      width: 496px;
      gap: 4px;
    }
    .grid.list-view .card {
      width: 496px;
      height: 54px;
      flex-direction: row;
      justify-content: flex-start;
      padding: 0 16px;
      gap: 16px;
    }
    .grid.list-view .card i.card-icon { font-size: 20px; flex-shrink: 0; }
    .grid.list-view .card .card-url { display: block; }

    .card-url {
      display: none;
      font-size: 11px;
      color: #4f545c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      margin-left: auto;
    }

    /* ── Drag states ── */
    .card.dragging { opacity: 0.3; }
    .card.drag-over { border-color: #5865f2 !important; background: rgba(88,101,242,0.1); }

    /* ── Edit-mode toggle button ── */
    .edit-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: #2f3136;
      border: 2px solid transparent;
      color: #72767d;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.12s, color 0.12s;
    }
    .edit-toggle:hover { border-color: #5865f2; color: #dcddde; }
    body.edit-mode .edit-toggle { border-color: #5865f2; color: #5865f2; }

    /* ── Modal overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #2f3136;
      width: 340px;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h3 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }

    /* icon preview */
    .modal-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      background: #202225;
    }
    .modal-preview i { font-size: 36px; }

    /* field rows */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #72767d; }
    .field input[type="text"],
    .field input[type="url"] {
      background: #202225;
      border: 2px solid transparent;
      color: #dcddde;
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.12s;
    }
    .field input[type="text"]:focus,
    .field input[type="url"]:focus { border-color: #5865f2; }

    /* color row */
    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .field input[type="color"] {
      width: 40px;
      height: 34px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }
    .color-label { font-size: 13px; color: #72767d; }

    /* icon picker grid */
    .icon-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
      background: #202225;
      padding: 8px;
    }
    .icon-picker::-webkit-scrollbar { width: 6px; }
    .icon-picker::-webkit-scrollbar-track { background: #202225; }
    .icon-picker::-webkit-scrollbar-thumb { background: #40444b; }

    .icon-picker button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1;
      background: transparent;
      border: 2px solid transparent;
      color: #72767d;
      font-size: 15px;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s;
    }
    .icon-picker button:hover { color: #dcddde; border-color: #40444b; }
    .icon-picker button.selected { color: #fff; border-color: #5865f2; }

    /* modal actions */
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .modal-actions button {
      padding: 8px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border: 2px solid transparent;
      cursor: pointer;
    }
    #btnCancel {
      background: #202225;
      color: #72767d;
      transition: border-color 0.12s, color 0.12s;
    }
    #btnCancel:hover { border-color: #72767d; color: #dcddde; }
    #btnSave {
      background: #5865f2;
      color: #fff;
      transition: background 0.12s;
    }
    #btnSave:hover { background: #4752c4; }
  </style>
</head>
<body>

  <!-- History sidebar -->
  <aside class="history-panel">
    <div class="panel-header">Recent</div>
    <div class="history-list" id="historyList">
      <p class="history-empty">Loading...</p>
    </div>
    <button class="open-selected" id="openSelected">
      <i class="fas fa-arrow-up-right-from-square"></i>
      <span id="openSelectedLabel">Open selected</span>
    </button>
  </aside>

  <!-- Main content -->
  <div class="main">
    <form class="search-wrapper" action="https://www.google.com/search" method="get">
      <i class="fab fa-google"></i>
      <input type="text" name="q" placeholder="Search Google..." autofocus>
    </form>

    <p class="greeting">Quick Links</p>

    <div class="grid-toolbar">
      <span class="toolbar-hint"><i class="fas fa-up-down-left-right"></i> Drag to reorder</span>
      <div class="view-btns">
        <button class="view-btn" id="viewGrid" title="Grid view"><i class="fas fa-grip"></i></button>
        <button class="view-btn" id="viewList" title="List view"><i class="fas fa-list"></i></button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- Edit toggle -->
  <button class="edit-toggle" id="editToggle" title="Customize cards">
    <i class="fas fa-pen"></i>
  </button>

  <!-- Edit modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Edit Card</h3>
      <div class="modal-preview">
        <i id="previewIcon"></i>
      </div>
      <div class="field">
        <label>Icon — click to pick or type a class below</label>
        <div class="icon-picker" id="iconPicker"></div>
        <input type="text" id="inputIcon" placeholder="fab fa-discord">
      </div>
      <div class="field">
        <label>Icon Color</label>
        <div class="color-row">
          <input type="color" id="inputColor" value="#5865f2">
          <span class="color-label">Pick a color for the icon</span>
        </div>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="inputTitle" placeholder="Discord">
      </div>
      <div class="field">
        <label>URL</label>
        <input type="url" id="inputUrl" placeholder="https://...">
      </div>
      <div class="modal-actions">
        <button type="button" id="btnCancel">Cancel</button>
        <button type="button" id="btnSave">Save</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>

</body>
</html>
