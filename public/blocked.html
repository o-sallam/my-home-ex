<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <title>Blocked · Custom Home</title>
  <style>
    :root { --bg: #1e1e1e; --panel: #252526; --border: #454545; --fg: #cccccc; --muted: #9d9d9d; --blue: #3794ff; --red: #f48771; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 400 13px/1.5 'Segoe UI', system-ui, -apple-system, 'Ubuntu', sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(480px, 100%); padding: 36px 32px 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 0 8px 2px #00000070; text-align: center; animation: in 420ms cubic-bezier(.22, 1, .36, 1) both; }
    .lock { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 50%; border: 1px solid #5a1d1d; background: #f4877114; color: var(--red); }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 400; letter-spacing: -.2px; }
    .reason { margin: 0 0 4px; color: var(--red); }
    .site { margin: 0 0 20px; color: var(--muted); font-size: 12px; }
    .facts { display: grid; gap: 8px; margin: 0 0 22px; padding: 14px; text-align: left; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; }
    .facts div { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; text-align: right; }
    .next dd { color: var(--blue); }
    .actions { display: flex; justify-content: center; gap: 10px; }
    a.button { display: inline-flex; align-items: center; min-height: 34px; padding: 0 16px; border-radius: 4px; background: #0e639c; color: #fff; text-decoration: none; font-size: 12px; transition: background-color 160ms ease; }
    a.button:hover { background: #1177bb; }
    a.button:focus-visible { outline: 1px solid #007fd4; outline-offset: 2px; }
    .hint { margin: 18px 0 0; color: var(--muted); font-size: 11px; }
    @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="lock" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>This website is not allowed to run at this time.</h1>
    <p id="reason" class="reason" role="status"></p>
    <p id="site" class="site"></p>
    <dl id="facts" class="facts"></dl>
    <div class="actions"><a id="home" class="button" href="index.html">Back to Home</a></div>
    <p id="hint" class="hint">This page reopens the website automatically when it is allowed again.</p>
  </main>
  <script src="limits-core.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
